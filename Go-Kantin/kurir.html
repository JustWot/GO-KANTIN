<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GO-KANTIN | Panel Kurir</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen pb-12">

  <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <span class="bg-blue-600 text-white font-black text-xs px-2.5 py-1 rounded-lg">KURIR</span>
      <div>
        <h1 class="text-base font-black">Panel Pengantar</h1>
        <p class="text-[11px] text-slate-400">Ambil & antar pesanan ke kelas</p>
      </div>
    </div>
    <button onclick="logout()" class="text-xs bg-red-600/90 hover:bg-red-600 px-3.5 py-2 rounded-xl font-bold transition">Keluar</button>
  </header>

  <main class="max-w-2xl mx-auto p-4 sm:p-6 space-y-6">
    <section class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-sm font-black uppercase text-slate-900 mb-3">📦 Siap Diambil di Kantin</h2>
      <div id="ready-list" class="space-y-3"></div>
    </section>

    <section class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-sm font-black uppercase text-blue-700 mb-3">🛵 Sedang Diantar</h2>
      <div id="delivering-list" class="space-y-3"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script>
    const session = JSON.parse(localStorage.getItem('gokantin_user') || '{}');
    if (session.role !== 'kurir' && session.role !== 'master') window.location.href = 'login.html';

    async function loadKurirOrders() {
      const { data: orders } = await db.from('orders').select('*').in('status', ['ready', 'delivering']);
      const ready = (orders || []).filter(o => o.status === 'ready');
      const delivering = (orders || []).filter(o => o.status === 'delivering');

      document.getElementById('ready-list').innerHTML = ready.length === 0
        ? `<p class="text-xs text-slate-400 text-center py-4">Belum ada pesanan siap ambil.</p>`
        : ready.map(o => `
          <div class="p-4 bg-slate-50 rounded-2xl border-l-4 border-amber-500 space-y-2 text-xs">
            <div class="flex justify-between font-black text-sm">
              <span>${o.student_name} (${o.location})</span>
              <span class="text-emerald-600">${formatIDR(o.total_amount)}</span>
            </div>
            <ul class="pl-4 list-disc text-slate-700">${o.items.map(i => `<li>${i.name} (x${i.quantity}) - ${i.stall}</li>`).join('')}</ul>
            <button onclick="setStatus('${o.order_id}', 'delivering')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl">🛵 Ambil & Antar</button>
          </div>
        `).join('');

      document.getElementById('delivering-list').innerHTML = delivering.length === 0
        ? `<p class="text-xs text-slate-400 text-center py-4">Tidak ada pengantaran aktif.</p>`
        : delivering.map(o => `
          <div class="p-4 bg-slate-50 rounded-2xl border-l-4 border-blue-600 space-y-2 text-xs">
            <div class="flex justify-between font-black text-sm">
              <span>${o.student_name} (${o.location})</span>
              <span class="text-emerald-600">Tagih: ${formatIDR(o.total_amount)}</span>
            </div>
            <button onclick="setStatus('${o.order_id}', 'delivered')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl">✓ Sudah Diterima Siswa</button>
          </div>
        `).join('');
    }

    async function setStatus(orderId, status) {
      await db.from('orders').update({ status }).eq('order_id', orderId);
      trackEvent('delivery_status_update', { order_id: orderId, status });
      loadKurirOrders();
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadKurirOrders();
      db.channel('kurir-live').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, loadKurirOrders).subscribe();
    });
  </script>
</body>
</html>
