<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GO-KANTIN | Pesan Makanan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 pb-20">

  <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center sticky top-0 z-40 shadow-md">
    <div>
      <h1 class="text-lg font-black tracking-tight text-emerald-400">GO-KANTIN</h1>
      <p id="student-info" class="text-xs text-slate-300">Memuat profil...</p>
    </div>
    <button onclick="logout()" class="text-xs bg-red-600/90 hover:bg-red-600 px-3.5 py-2 rounded-xl font-bold transition">Keluar</button>
  </header>

  <main class="max-w-6xl mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 space-y-4">
      <div class="flex flex-wrap justify-between items-center gap-2">
        <h2 class="text-base font-black text-slate-900">🍽️ Menu Tersedia Hari Ini</h2>
        <div class="flex gap-1.5" id="category-filters">
          <button onclick="filterCategory('Semua')" class="cat-btn bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl">Semua</button>
          <button onclick="filterCategory('Makanan Berat')" class="cat-btn bg-white text-slate-600 border border-slate-200 text-xs font-bold px-3 py-1.5 rounded-xl">Makanan</button>
          <button onclick="filterCategory('Minuman')" class="cat-btn bg-white text-slate-600 border border-slate-200 text-xs font-bold px-3 py-1.5 rounded-xl">Minuman</button>
          <button onclick="filterCategory('Snack')" class="cat-btn bg-white text-slate-600 border border-slate-200 text-xs font-bold px-3 py-1.5 rounded-xl">Snack</button>
        </div>
      </div>

      <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <p class="text-xs text-slate-400 col-span-full py-8 text-center">Memuat daftar menu...</p>
      </div>
    </div>

    <div class="space-y-6">
      <section class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm">
        <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-3">
          <h2 class="text-sm font-black uppercase text-slate-900">🛒 Keranjang Kamu</h2>
          <span id="cart-badge" class="bg-emerald-600 text-white text-xs font-black px-2.5 py-0.5 rounded-full">0</span>
        </div>
        <div id="cart-list" class="space-y-2 max-h-60 overflow-y-auto">
          <p class="text-xs text-slate-400 text-center py-4">Keranjang masih kosong</p>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-100 space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Waktu Pengantaran</label>
            <select id="order-slot" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold">
              <option value="Istirahat 1 (09:45)">Istirahat 1 (09:45)</option>
              <option value="Istirahat 2 (12:00)">Istirahat 2 (12:00)</option>
              <option value="Antar Sekarang">Antar Sekarang</option>
            </select>
          </div>
          <div class="flex justify-between items-center text-xs text-slate-500">
            <span>Ongkir Kurir (<span id="fee-item-count">0</span> item)</span>
            <span id="cart-delivery-fee" class="font-bold text-slate-700">Rp 0</span>
          </div>
          <div class="flex justify-between items-center font-black text-sm">
            <span>Total Bayar (COD)</span>
            <span id="cart-total" class="text-emerald-600">Rp 0</span>
          </div>
          <button onclick="submitOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-xs shadow-md transition">
            Pesan Sekarang
          </button>
        </div>
      </section>

      <section class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm">
        <h2 class="text-sm font-black uppercase text-slate-900 mb-3">🛵 Status Pesananmu</h2>
        <div id="my-orders-list" class="space-y-3">
          <p class="text-xs text-slate-400 text-center py-4">Belum ada pesanan aktif.</p>
        </div>
      </section>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
