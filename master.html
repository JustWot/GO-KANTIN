<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GO-KANTIN | Master Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen">

  <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <span class="bg-amber-500 text-slate-900 font-black text-xs px-2.5 py-1 rounded-lg">MASTER</span>
      <div>
        <h1 class="text-base font-black">Approval Center</h1>
        <p class="text-[11px] text-slate-400">Verifikasi akun kantin & kurir</p>
      </div>
    </div>
    <div class="flex gap-2">
      <a href="admin.html" class="text-xs bg-slate-800 px-3 py-2 rounded-xl font-bold">Kantin</a>
      <a href="kurir.html" class="text-xs bg-slate-800 px-3 py-2 rounded-xl font-bold">Kurir</a>
      <button onclick="logout()" class="text-xs bg-red-600 px-3 py-2 rounded-xl font-bold">Keluar</button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4 sm:p-6 space-y-6">
    <section class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-sm font-black uppercase text-slate-900 mb-3">Antrean Persetujuan Akun</h2>
      <div id="pending-list" class="divide-y divide-slate-100"></div>
    </section>

    <section class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-sm font-black uppercase text-slate-900 mb-3">Akun Aktif</h2>
      <div id="active-list" class="divide-y divide-slate-100"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script>
    const session = requireRole(['master']);

    async function loadAccounts() {
      const { data: accounts, error } = await db.from('owners').select('id, username, shop_name, role, verified, created_at').neq('role', 'master').order('created_at', { ascending: false });
      if (error) { alert('Gagal memuat akun: ' + error.message); return; }
      const pending = (accounts || []).filter(a => !a.verified);
      const active = (accounts || []).filter(a => a.verified);

      document.getElementById('pending-list').innerHTML = pending.length === 0
        ? `<p class="text-xs text-slate-400 py-4 text-center">Tidak ada pendaftaran baru.</p>`
        : pending.map(a => `
          <div class="py-3 flex justify-between items-center text-xs">
            <div>
              <span class="font-black text-sm">${esc(a.shop_name)}</span>
              <span class="ml-2 px-2 py-0.5 rounded bg-slate-100 font-bold uppercase">${esc(a.role)}</span>
              <p class="text-slate-500">Username: ${esc(a.username)}</p>
            </div>
            <div class="flex gap-2">
              <button onclick="approve('${a.id}')" class="bg-emerald-600 text-white px-3 py-2 rounded-xl font-bold">✓ Setujui</button>
              <button onclick="removeAcc('${a.id}')" class="bg-red-50 text-red-600 px-3 py-2 rounded-xl font-bold">✕ Tolak</button>
            </div>
          </div>
        `).join('');

      document.getElementById('active-list').innerHTML = active.length === 0
        ? `<p class="text-xs text-slate-400 py-4 text-center">Belum ada akun aktif.</p>`
        : active.map(a => `
          <div class="py-3 flex justify-between items-center text-xs">
            <div>
              <span class="font-black text-sm">${esc(a.shop_name)}</span> (${esc(a.role)})
              <p class="text-slate-400">${esc(a.username)}</p>
            </div>
            <button onclick="removeAcc('${a.id}')" class="text-red-500 font-bold hover:underline">Hapus</button>
          </div>
        `).join('');
    }

    async function approve(id) {
      const { error } = await db.from('owners').update({ verified: true }).eq('id', id);
      if (error) alert('Gagal: ' + error.message);
      loadAccounts();
    }

    async function removeAcc(id) {
      if (!confirm('Hapus akun ini?')) return;
      const { error } = await db.from('owners').delete().eq('id', id);
      if (error) alert('Gagal: ' + error.message);
      loadAccounts();
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!session) return;
      loadAccounts();
      db.channel('master-live').on('postgres_changes', { event: '*', schema: 'public', table: 'owners' }, loadAccounts).subscribe();
    });
  </script>
</body>
</html>
