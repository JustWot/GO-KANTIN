<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GO-KANTIN | Panel Kurir</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen pb-12">

  <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <span class="bg-blue-600 text-white font-black text-xs px-2.5 py-1 rounded-lg">KURIR</span>
      <div>
        <h1 class="text-base font-black">Panel Pengantar</h1>
        <p id="kurir-name-label" class="text-[11px] text-slate-400">Ambil & antar pesanan ke kelas</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="master.html" id="master-nav-btn" class="hidden text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl font-bold transition">Master</a>
      <button onclick="logout()" class="text-xs bg-red-600/90 hover:bg-red-600 px-3.5 py-2 rounded-xl font-bold transition">Keluar</button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto p-4 sm:p-6 space-y-6">
    <section class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white rounded-3xl p-6 shadow-md flex justify-between items-center">
      <div>
        <p class="text-xs font-bold uppercase tracking-wider text-blue-100">Total Pendapatan Kurir</p>
        <h2 id="kurir-earnings" class="text-3xl font-black mt-1">Rp 0</h2>
        <p id="kurir-trip-count" class="text-xs text-blue-100 mt-1">0 pengantaran selesai</p>
      </div>
      <div class="bg-white/15 px-4 py-2.5 rounded-2xl text-right">
        <p class="text-[11px] text-blue-100">Tarif / Item</p>
        <p id="fee-rate-label" class="font-black text-sm">Rp 2.000</p>
      </div>
    </section>

    <section class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-sm font-black uppercase text-slate-900 mb-3">📦 Siap Diambil di Kantin</h2>
      <div id="ready-list" class="space-y-3"></div>
    </section>

    <section class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-sm font-black uppercase text-blue-700 mb-3">🛵 Sedang Diantar</h2>
      <div id="delivering-list" class="space-y-3"></div>
    </section>
  </main>

  <script src="js/config.js"></script>

    const session = JSON.parse(localStorage.getItem('gokantin_user') || '{}');
    if (session.role !== 'kurir' && session.role !== 'master') window.location.href = 'login.html';

      document.getElementById('master-nav-btn')?.classList.remove('hidden');
    }
