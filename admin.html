<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GO-KANTIN | Panel Kantin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen">

  <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <span class="bg-emerald-600 text-white font-black text-xs px-2.5 py-1 rounded-lg">KANTIN</span>
      <div>
        <h1 id="shop-title" class="text-base font-black">Panel Kelola Kantin</h1>
        <p class="text-[11px] text-slate-400">Tambah menu & proses pesanan masuk</p>
      </div>
    </div>
    <button onclick="logout()" class="text-xs bg-red-600/90 hover:bg-red-600 px-3.5 py-2 rounded-xl font-bold transition">Keluar</button>
  </header>

  <main class="max-w-6xl mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
    <section class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 h-fit">
      <h2 class="text-sm font-black uppercase text-slate-900 mb-4">+ Tambah Menu Baru</h2>
      <form onsubmit="addNewMenu(event)" class="space-y-3.5">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Nama Menu</label>
          <input type="text" id="menu-name" placeholder="Contoh: Ayam Geprek" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Nama Kantin</label>
          <input type="text" id="menu-stall" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Harga (Rp)</label>
          <input type="number" id="menu-price" placeholder="15000" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Kategori</label>
          <select id="menu-category" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="Makanan Berat">Makanan Berat</option>
            <option value="Minuman">Minuman</option>
            <option value="Snack">Snack</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Upload Foto Makanan</label>
          <input type="file" id="menu-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:font-bold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100" />
        </div>
        <button type="submit" id="save-menu-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-xs shadow-md transition">
          Simpan & Terbitkan Menu
        </button>
      </form>
    </section>

    <div class="lg:col-span-2 space-y-6">
      <section class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
        <h2 class="text-sm font-black uppercase text-slate-900 mb-3">🔔 Pesanan Masuk</h2>
        <div id="admin-orders-list" class="divide-y divide-slate-100">
          <p class="text-xs text-slate-400 py-6 text-center">Memuat pesanan...</p>
        </div>
      </section>

      <section class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
        <h2 class="text-sm font-black uppercase text-slate-900 mb-3">📋 Menu Aktif Kantin</h2>
        <div id="admin-menu-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
      </section>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
