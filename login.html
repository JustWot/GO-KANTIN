<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GO-KANTIN | Masuk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-emerald-950 to-slate-900 flex items-center justify-center min-h-screen font-sans px-4">

  <div class="bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/20">
    <div class="text-center mb-6">
      <span class="inline-block bg-emerald-100 text-emerald-800 text-[11px] font-black uppercase tracking-wider px-3 py-1 rounded-full mb-3">
        SMK Telkom Purwokerto
      </span>
      <h1 class="text-3xl font-black tracking-tight text-slate-900">GO-KANTIN</h1>
      <p class="text-xs text-slate-500 mt-1">Pilih peran kamu untuk masuk ke sistem</p>
    </div>

    <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-6">
      <button type="button" onclick="switchRole('student')" id="tab-student" class="flex-1 py-2 text-xs font-bold rounded-xl bg-white text-emerald-700 shadow-sm transition">Siswa</button>
      <button type="button" onclick="switchRole('admin')" id="tab-admin" class="flex-1 py-2 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-800 transition">Kantin</button>
      <button type="button" onclick="switchRole('kurir')" id="tab-kurir" class="flex-1 py-2 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-800 transition">Kurir</button>
    </div>

    <form onsubmit="handleAuth(event)" class="space-y-4">
      <div id="student-fields" class="space-y-3">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Nama Lengkap</label>
          <input type="text" id="student-name" placeholder="Contoh: Rasya Radithya" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Kelas / Ruangan</label>
          <input type="text" id="student-class" placeholder="Contoh: XI TJKT 4" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
      </div>

      <div id="staff-fields" class="hidden space-y-3">
        <div id="shop-wrapper" class="hidden">
          <label id="shop-label" class="block text-xs font-bold uppercase text-slate-600 mb-1">Nama Kantin</label>
          <input type="text" id="staff-shop" placeholder="Contoh: Kantin Bu Siti" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Username</label>
          <input type="text" id="staff-user" placeholder="Masukkan username" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Password</label>
          <input type="password" id="staff-pass" placeholder="Masukkan password" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
        </div>
        <p id="toggle-mode-text" onclick="toggleRegister()" class="text-center text-xs text-emerald-600 font-bold cursor-pointer hover:underline pt-1">
          Belum punya akun? Daftar sekarang
        </p>
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 rounded-xl text-sm shadow-lg shadow-emerald-600/20 transition">
        Masuk sebagai Siswa
      </button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script>
    let currentRole = 'student';
    let isRegister = false;

    function switchRole(role) {
      currentRole = role;
      ['student', 'admin', 'kurir'].forEach(r => {
        document.getElementById(`tab-${r}`).className = r === role
          ? 'flex-1 py-2 text-xs font-bold rounded-xl bg-white text-emerald-700 shadow-sm transition'
          : 'flex-1 py-2 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-800 transition';
      });

      document.getElementById('student-fields').classList.toggle('hidden', role !== 'student');
      document.getElementById('staff-fields').classList.toggle('hidden', role === 'student');

      if (role !== 'student') {
        document.getElementById('shop-label').textContent = role === 'admin' ? 'Nama Kantin / Stand' : 'Nama Lengkap Kurir';
        document.getElementById('staff-shop').placeholder = role === 'admin' ? 'Contoh: Kantin Bu Siti' : 'Contoh: Andi (Kurir)';
      }
      updateBtn();
    }

    function toggleRegister() {
      isRegister = !isRegister;
      document.getElementById('shop-wrapper').classList.toggle('hidden', !isRegister);
      document.getElementById('toggle-mode-text').textContent = isRegister
        ? 'Sudah punya akun? Masuk di sini'
        : 'Belum punya akun? Daftar sekarang';
      updateBtn();
    }

    function updateBtn() {
      const btn = document.getElementById('submit-btn');
      if (currentRole === 'student') btn.textContent = 'Masuk sebagai Siswa';
      else if (isRegister) btn.textContent = currentRole === 'admin' ? 'Daftar Kantin' : 'Daftar Kurir';
      else btn.textContent = currentRole === 'admin' ? 'Masuk Panel Kantin' : 'Masuk Panel Kurir';
    }

    async function handleAuth(e) {
      e.preventDefault();
      if (currentRole === 'student') {
        const name = document.getElementById('student-name').value.trim();
        const studentClass = document.getElementById('student-class').value.trim();
        if (!name || !studentClass) return alert('Isi nama dan kelas terlebih dahulu!');
        localStorage.setItem('gokantin_user', JSON.stringify({ name, class: studentClass, role: 'student' }));
        trackEvent('login', { method: 'student' });
        window.location.href = 'index.html';
        return;
      }

      const username = document.getElementById('staff-user').value.trim();
      const password = document.getElementById('staff-pass').value;
      const shop_name = document.getElementById('staff-shop').value.trim();

      if (!username || !password) return alert('Username dan password wajib diisi!');

      if (!isRegister && username === 'master' && password === 'admin123') {
        localStorage.setItem('gokantin_user', JSON.stringify({ username: 'master', role: 'master' }));
        window.location.href = 'master.html';
        return;
      }

      if (isRegister) {
        if (!shop_name) return alert('Nama kantin/kurir wajib diisi!');
        const { error } = await db.from('owners').insert([{ username, password, shop_name, role: currentRole, verified: false }]);
        if (error) return alert('Gagal daftar: ' + error.message);
        trackEvent('sign_up', { role: currentRole });
        alert('Pendaftaran berhasil! Tunggu persetujuan Master Admin.');
        toggleRegister();
      } else {
        const { data: user, error } = await db.from('owners').select('*').eq('username', username).eq('password', password).single();
        if (error || !user) return alert('Username atau password salah!');
        if (!user.verified) return alert('Akun belum diverifikasi Master Admin.');
        localStorage.setItem('gokantin_user', JSON.stringify(user));
        trackEvent('login', { method: user.role });
        window.location.href = user.role === 'kurir' ? 'kurir.html' : 'admin.html';
      }
    }
  </script>
</body>
</html>
